<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0A0A0A}
.wrap{width:1200px;height:630px;position:relative;display:flex;flex-direction:column;justify-content:center;padding:0 96px}
.glow{position:absolute;top:50%;left:38%;transform:translate(-50%,-50%);width:560px;height:560px;background:radial-gradient(ellipse at center,rgba(201,169,110,.06) 0%,transparent 68%);pointer-events:none}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(201,169,110,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(201,169,110,.025) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.line-t{position:absolute;top:0;left:80px;right:80px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,110,.35),transparent)}
.line-b{position:absolute;bottom:0;left:80px;right:80px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,110,.35),transparent)}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#5A5650;margin-bottom:28px}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:128px;font-weight:300;letter-spacing:.28em;padding-left:.28em;line-height:.9;background:linear-gradient(160deg,#6B4F2A 0%,#A07845 18%,#C9A96E 35%,#E8C878 48%,#C9A96E 58%,#A07845 72%,#6B4F2A 85%,#C9A96E 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 4px 24px rgba(201,169,110,.18));display:block;margin-bottom:24px}
.divider{width:280px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,110,.5),transparent);margin:0 0 22px}
.tagline{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.44em;padding-left:.44em;color:#5A5650;text-transform:uppercase;margin-bottom:44px}
.metrics{display:flex;gap:56px}
.m-val{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;color:#C9A96E;display:block;line-height:1;margin-bottom:5px}
.m-label{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#3A3A3A}
.url{position:absolute;bottom:36px;right:96px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#2A2A2A}
</style></head><body>
<div class="wrap">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="line-t"></div>
  <div class="line-b"></div>
  <div class="eyebrow">Oracle Critical Engineering · México</div>
  <span class="logo">FABRIC</span>
  <div class="divider"></div>
  <div class="tagline">Rescata, estabiliza y blinda proyectos Oracle</div>
  <div class="metrics">
    <div><span class="m-val">90d</span><span class="m-label">Estabilización Post Go-Live</span></div>
    <div><span class="m-val">0</span><span class="m-label">Juniors Facturables</span></div>
    <div><span class="m-val">100%</span><span class="m-label">Responsabilidad Contractual</span></div>
  </div>
  <div class="url">equipo-a-v2.vercel.app</div>
</div>
</body></html>
